<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img"><style>text{font-family:Segoe UI,Arial,sans-serif} @media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="960" height="260" rx="14" fill="#0d1824"/><style>.core{animation:pulse 6s infinite}@keyframes pulse{35%,55%{stroke-width:5}0%,70%,100%{stroke-width:1}}</style><rect x="30" y="32" width="240" height="42" rx="6" fill="#132535" stroke="#294352"/><text x="150" y="59" text-anchor="middle" fill="#dceaf4" font-size="16">APIs e sistemas</text><path d="M270 53 L405 53" stroke="#294352" fill="none"/><circle r="4" fill="#45d9ed"><animateMotion path="M270 53 L405 53" dur="6s" begin="0s" repeatCount="indefinite"/></circle><rect x="30" y="97" width="240" height="42" rx="6" fill="#132535" stroke="#294352"/><text x="150" y="124" text-anchor="middle" fill="#dceaf4" font-size="16">Arquivos e planilhas</text><path d="M270 118 L405 118" stroke="#294352" fill="none"/><circle r="4" fill="#45d9ed"><animateMotion path="M270 118 L405 118" dur="6s" begin="0s" repeatCount="indefinite"/></circle><rect x="30" y="162" width="240" height="42" rx="6" fill="#132535" stroke="#294352"/><text x="150" y="189" text-anchor="middle" fill="#dceaf4" font-size="16">Sites e portais</text><path d="M270 183 L405 183" stroke="#294352" fill="none"/><circle r="4" fill="#45d9ed"><animateMotion path="M270 183 L405 183" dur="6s" begin="0s" repeatCount="indefinite"/></circle><rect x="690" y="32" width="240" height="42" rx="6" fill="#132535" stroke="#294352"/><text x="810" y="59" text-anchor="middle" fill="#dceaf4" font-size="16">Dados validados</text><path d="M555 53 L690 53" stroke="#294352" fill="none"/><circle r="4" fill="#45d9ed"><animateMotion path="M555 53 L690 53" dur="6s" begin="3s" repeatCount="indefinite"/></circle><rect x="690" y="97" width="240" height="42" rx="6" fill="#132535" stroke="#294352"/><text x="810" y="124" text-anchor="middle" fill="#dceaf4" font-size="16">Alertas e relatórios</text><path d="M555 118 L690 118" stroke="#294352" fill="none"/><circle r="4" fill="#45d9ed"><animateMotion path="M555 118 L690 118" dur="6s" begin="3s" repeatCount="indefinite"/></circle><rect x="690" y="162" width="240" height="42" rx="6" fill="#132535" stroke="#294352"/><text x="810" y="189" text-anchor="middle" fill="#dceaf4" font-size="16">Sistemas atualizados</text><path d="M555 183 L690 183" stroke="#294352" fill="none"/><circle r="4" fill="#45d9ed"><animateMotion path="M555 183 L690 183" dur="6s" begin="3s" repeatCount="indefinite"/></circle><rect class="core" x="405" y="42" width="150" height="150" rx="28" fill="#142e3a" stroke="#45d9ed"/><text x="480" y="108" text-anchor="middle" fill="#45d9ed" font-size="17">AUTOMAÇÃO</text><text x="480" y="137" text-anchor="middle" fill="#a3b2c5" font-size="13">Validar · Transformar</text><g fill="#8ea8ba" font-size="12" letter-spacing="2"><text x="70" y="238">01 / COLETAR</text><text x="405" y="238">02 / PROCESSAR</text><text x="735" y="238">03 / ENTREGAR</text></g></svg>