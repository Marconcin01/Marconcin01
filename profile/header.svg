<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img"><style>text{font-family:Segoe UI,Arial,sans-serif} @media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1d3947" stroke-width=".6"/></pattern></defs><rect width="960" height="330" rx="16" fill="#0d1824"/><rect width="960" height="330" rx="16" fill="url(#grid)"/><text x="48" y="45" fill="#45d9ed" font-size="13" letter-spacing="3">RENAN MARCONCIN ALMEIDA</text><g fill="#edf4fc" font-size="42" font-weight="600"><text x="48" y="109">Automatizo processos.</text><text x="48" y="163">Conecto sistemas.</text><text x="48" y="217">Simplifico operações.</text></g><style>.phrase{animation:phrases 16s infinite;opacity:0}.p2{animation-delay:4s}.p3{animation-delay:8s}.p4{animation-delay:12s}@keyframes phrases{0%,23%{opacity:1}25%,100%{opacity:0}}.cursor{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}</style><g fill="#45d9ed" font-size="20"><text class="phrase" x="48" y="277">Automação web</text><text class="phrase p2" x="48" y="277">Integração de APIs</text><text class="phrase p3" x="48" y="277">Tratamento de dados</text><text class="phrase p4" x="48" y="277">Desenvolvimento de sistemas</text><text class="cursor" x="650" y="277">▌</text></g><circle cx="845" cy="165" r="62" fill="none" stroke="#234754"/><circle cx="845" cy="165" r="42" fill="none" stroke="#45d9ed" stroke-width="2" stroke-dasharray="80 184"><animateTransform attributeName="transform" type="rotate" from="0 845 165" to="360 845 165" dur="12s" repeatCount="indefinite"/></circle><text x="845" y="175" text-anchor="middle" fill="#45d9ed" font-size="30">&lt;/&gt;</text></svg>